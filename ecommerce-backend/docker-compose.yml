version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j_eccomerce
    ports:
      - "7474:7474" # HTTP port (for Neo4j Browser)
      - "7687:7687" # Bolt port (for the application)
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
